name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  tests:
    name: Tests (stdlib, sans dépendance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Framework Red/Blue/Purple
        run: python tests/test_orchestrator.py
      - name: Pont injection + détection
        run: python tests/test_llm_injection.py
